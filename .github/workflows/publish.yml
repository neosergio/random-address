name: Publish

# Publishing a GitHub Release publishes to PyPI. Draft the release, check it,
# then hit Publish; a tag alone does nothing, so a stray `git push --tags` cannot
# ship a version by accident.
#
# Rehearse first with the workflow_dispatch below, target=testpypi. PyPI version
# numbers are immutable, so a half-finished upload cannot be redone.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

# The GITHUB_TOKEN defaults to broad write access. Nothing here needs it;
# the publish jobs re-grant id-token: write for Trusted Publishing.
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*

      # The version is written once, as __version__, and pyproject.toml reads it
      # at build time. Comparing pyproject against __version__ would now compare
      # a value with itself, so the guard checks what actually ships instead:
      # the version in the built wheel's name, which is what PyPI publishes, and
      # the version the installed wheel reports from `random-address --version`.
      # Either disagreeing with the release tag stops the release.
      - name: Check the release tag matches the built package
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          wheel=$(ls dist/*.whl)
          built=$(basename "$wheel" | cut -d- -f2)
          python -m venv /tmp/guard
          /tmp/guard/bin/pip install --quiet "$wheel"
          reported=$(cd /tmp && /tmp/guard/bin/random-address --version | awk '{print $2}')
          if [ "$tag" != "$built" ] || [ "$tag" != "$reported" ]; then
            echo "::error::Release tag is v$tag, the wheel is $built, the CLI reports $reported."
            echo "PyPI would publish $built. Fix __version__ so all three agree."
            exit 1
          fi
          echo "Tag v$tag matches the built wheel and the installed CLI."

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      # Required for Trusted Publishing; no API token is stored in the repo.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI versions are immutable too. Without this, rehearsing the
          # same version twice fails on the upload rather than on anything
          # worth learning about.
          skip-existing: true

  pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
